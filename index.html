<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Click Me</title>
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #111;
		}

		.btn {
			padding: 14px 32px;
			border-radius: 14px;
			border: 1px solid rgba(255, 255, 255, 0.22);
			background: rgba(255, 255, 255, 0.1);
			backdrop-filter: blur(20px);
			color: rgba(255, 255, 255, 0.9);
			font-size: 15px;
			font-weight: 500;
			cursor: pointer;
			transition: background 0.2s, transform 0.15s;
		}

		.btn:hover {
			background: rgba(255, 255, 255, 0.18);
			transform: translateY(-1px);
		}

		.btn:active {
			transform: scale(0.97);
		}
	</style>
</head>

<body>

	<button class="btn" onclick="openIt()">Click me</button>

	<script>
		function openIt() {
      var win = window.open("about:blank", "_blank");
      if (!win) { alert("Allow popups and try again."); return; }
      win.document.open();
      win.document.write(
        '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>about:blank</title>' +
        '<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;}' +
        'iframe{width:100vw;height:100vh;border:none;display:block;}</style></head>' +
        '<body><iframe src="https://badideahere.github.io/iegaio/"></iframe></body></html>'
      );
      win.document.close();
    }
	</script>

</body>

</html>
